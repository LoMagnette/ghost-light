<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Silence of Hall 8</title>
    <meta
      name="description"
      content="Three robots walk the Kinepolis Antwerp across three eras. A Devoxx Belgium Robot Games entry."
    />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0a0c0d;
        overflow: hidden;
        font-family:
          ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #game {
        width: 100vw;
        height: 100vh;
      }
      #game canvas {
        display: block;
      }
      /* Shown until Phaser boots, and if WebGL is unavailable. */
      #boot-fallback {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        text-align: center;
        color: #8b9398;
        font-size: 0.875rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot-fallback">Powering on&hellip;</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
