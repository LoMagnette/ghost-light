<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ghost Light</title>
    <meta
      name="description"
      content="Three robots walk the Kinepolis Antwerp across three eras. A Devoxx Belgium Robot Games entry."
    />
    <style>
      :root {
        color-scheme: dark;
        /* Design resolution. The stage is scaled to fit; the world never reflows. */
        --view-w: 1280px;
        --view-h: 720px;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #06080a;
        overflow: hidden;
        font-family:
          ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }

      /*
       * Everything is authored at 1280x720 and the whole stage is scaled to fit
       * the window, which is what Phaser's Scale.FIT did. Doing it here rather
       * than in the renderer keeps the DOM overlay in the same coordinate space
       * as the canvas: a HUD line at y=46 is at y=46 in every window size.
       */
      #stage {
        position: absolute;
        width: var(--view-w);
        height: var(--view-h);
        transform-origin: top left;
        overflow: hidden;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* The UI layer sits over the canvas and only takes the clicks it is given. */
      #ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
        user-select: none;
      }
      #ui > * {
        pointer-events: auto;
      }

      /*
       * Phones and tablets (see src/input/Touch.ts). The page must not
       * scroll, zoom or select under a thumb, and the stage is half size on
       * a phone, so the text a player has to read is drawn bigger: `zoom`
       * on what is anchored to the top or the sides, a scale from the
       * bottom-left corner on what is placed near the bottom by its top.
       */
      html.touch,
      html.touch body {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* From the stage's real scale: see `touchZoom` in src/app/Game.ts. */
      html.touch .touch-talk {
        zoom: var(--talk-zoom, 1.45);
      }
      html.touch .touch-zoom {
        zoom: var(--hud-zoom, 1.3);
      }
      html.touch .touch-panel {
        zoom: var(--panel-zoom, 1.2);
      }
      html.touch .touch-grow-centre {
        transform: scale(1.4);
      }
      html.touch .touch-grow {
        transform: scale(var(--hud-zoom, 1.3));
        transform-origin: left bottom;
      }

      /* The album's pages, the who's who's cards and their CLOSE, chosen from the keyboard (album.ts, cast.ts). */
      .album-cell:focus-visible,
      .album-close:focus-visible,
      .cast-cell:focus-visible,
      .cast-close:focus-visible {
        outline: 2px solid #f24471;
        outline-offset: 6px;
      }
      .album-cell:focus:not(:focus-visible),
      .album-close:focus:not(:focus-visible),
      .cast-cell:focus:not(:focus-visible),
      .cast-close:focus:not(:focus-visible) {
        outline: none;
      }

      /* A phone held upright shows a strip of game: ask for it sideways. */
      #rotate {
        display: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          position: fixed;
          inset: 0;
          z-index: 30;
          display: grid;
          place-content: center;
          gap: 14px;
          padding: 24px;
          text-align: center;
          background: #06080a;
          color: #c9d0d4;
          font-size: 15px;
          letter-spacing: 0.06em;
        }
        #rotate .turn {
          font-size: 44px;
          color: #f24471;
        }
      }

      #boot-fallback {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        text-align: center;
        color: #8b9398;
        font-size: 0.875rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="ui"></div>
    </div>
    <div id="rotate"><div class="turn">&#x27F3;</div><div>Turn your phone sideways to play</div></div>
    <div id="boot-fallback">Powering on&hellip;</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
